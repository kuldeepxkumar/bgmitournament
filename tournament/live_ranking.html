<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Ranking Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700;800;900&family=Teko:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ===== BGMI Esports Color System ===== */    //1234
html,body{
  margin:0;padding:0;background:transparent;
  font-family:'Rajdhani',sans-serif;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  width:100vw;
  height:100vh;
}

/* 1. SIDEBAR VIEW (#stage) */
#stage{
  position:fixed;
  top:20px;
  left:20px;
  width:250px;
  border-radius:4px;
  overflow:hidden;
  box-shadow:0 4px 18px rgba(0,0,0,.45);
  transition: transform 0.3s ease, opacity 0.2s ease;
  z-index: 100;
}
#stage.hidden{
  transform: translateX(-300px);
  opacity: 0;
  pointer-events: none;
}

.head{
  display:grid;
  grid-template-columns:20px 1fr 58px 22px 30px;
  align-items:center;
  background:linear-gradient(90deg,#0f2a3a,#123b4f 60%,#146277);
  border-bottom:2px solid #0a4a5c;
  padding:6px 6px;
}
.head div{ color:#8fe9ef; font-weight:700; letter-spacing:0.6px; }
.head div:first-child{ font-size:12px; color:#ffd23f; }
.head div:nth-child(2){ font-size:12px; color:#ffffff; }
.head div:nth-child(3){ font-size:11px; padding-left:6px; }
.head div:nth-child(4),.head div:nth-child(5){ font-size:11px; }

#rows{ position:relative; }
.row{
  position:absolute; left:0; right:0; height:34px;
  display:grid; grid-template-columns:20px 1fr 58px 22px 30px;
  gap:4px; align-items:center; padding:0 6px;
  border-bottom:1px solid rgba(0,0,0,.35); box-sizing:border-box;
  transition:top .2s ease, background .15s ease;
  will-change:top;
}
.row.eliminated{ filter:grayscale(.6) brightness(.55); }

.rank-badge{
  width:20px; height:20px; font-weight:700; font-size:13px;
  display:flex; align-items:center; justify-content:center; border-radius:3px;
}
.team-cell{ display:flex; align-items:center; gap:6px; font-weight:700; font-size:13px; min-width:0; }
.team-name{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; font-weight:600; letter-spacing:0.2px; text-shadow:0 1px 2px rgba(0,0,0,.55); }
.team-logo{ flex-shrink:0; width:18px; height:18px; border-radius:2px; object-fit:contain; background:rgba(255,255,255,.15); }
.status-bar{ display:inline-block; width:6px; height:12px; border-radius:1px; margin-right:2px; }
.status-cell{ padding-left:6px; display:flex; }
.fin-cell{ text-align:center; font-weight:700; font-size:13px; }
.pts-cell{ text-align:center; font-weight:700; font-size:16px; }
.foot{
  display:flex; gap:8px; justify-content:center; align-items:center;
  background:linear-gradient(90deg,#146277,#123b4f 60%,#0f2a3a);
  border-top:2px solid #0a4a5c; padding:6px 0;
}
.legend-item{ display:flex; align-items:center; gap:3px; font-size:9px; color:#e7fbfc; font-weight:700; }
.legend-chip{ display:inline-block; width:9px; height:9px; border-radius:1px; }
.empty{ padding:16px 10px; text-align:center; color:#8fa3ad; font-size:12px; background:#101820; font-weight:600; }

/* 2. TOP HORIZONTAL FINAL 4 HUD */
#final4-bar{
  position:fixed; top:16px; left:50%;
  transform:translateX(-50%) translateY(0);
  display:flex; gap:12px; z-index:200;
  transition:transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease;
}
#final4-bar.hidden{
  transform:translateX(-50%) translateY(-100px);
  opacity:0; pointer-events:none;
}
.f4-card{
  display:flex; align-items:center;
  background:linear-gradient(180deg,#0f2a3a,#091a24 90%);
  border:1px solid #146277; border-top:2px solid #17c9d1;
  border-radius:4px; padding:6px 14px; gap:12px; min-width:190px;
  box-shadow:0 8px 24px rgba(0,0,0,0.6); position:relative;
  transition:all 0.2s ease;
}
.f4-card.eliminated{ filter:grayscale(0.8) brightness(0.5); border-top-color:#ef4444; }
.f4-logo{ width:32px; height:32px; border-radius:3px; object-fit:contain; background:rgba(255,255,255,0.08); flex-shrink:0; }
.f4-details{ display:flex; flex-direction:column; gap:3px; flex:1; min-width:0; }
.f4-name{ font-size:15px; font-weight:700; color:#ffffff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.f4-status{ display:flex; gap:3px; }
.f4-status-bar{ width:10px; height:8px; border-radius:1px; }
.f4-kills{ display:flex; flex-direction:column; align-items:center; justify-content:center; border-left:1px solid rgba(255,255,255,0.12); padding-left:10px; min-width:34px; }
.f4-kills-val{ font-size:20px; font-weight:700; color:#ffd23f; line-height:1; }
.f4-kills-lbl{ font-size:8px; color:#8fe9ef; letter-spacing:0.5px; font-weight:700; }

/* ==========================================================
   3. CINEMATIC bgmi ESPORTS WINNER REVEAL SCREEN
   ========================================================== */
#winner-overlay{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  background:radial-gradient(ellipse at center, rgba(14, 18, 26, 0.90) 0%, rgba(4, 6, 10, 0.98) 100%);
  opacity:1;
  transition:opacity 0.6s ease;
  overflow:hidden;
}
#winner-overlay.hidden{
  opacity:0;
  pointer-events:none;
  display:none;
}

/* Background Embers Canvas */
#embersCanvas{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:1;
}

/* Spotlight God Rays */
.spotlight-ray{
  position:absolute;
  top:-20%;
  left:50%;
  transform:translateX(-50%);
  width:900px;
  height:1200px;
  background:radial-gradient(ellipse at top, rgba(255, 178, 36, 0.35) 0%, rgba(255, 140, 0, 0.12) 40%, transparent 75%);
  filter:blur(30px);
  pointer-events:none;
  z-index:2;
  animation:rayPulse 4s ease-in-out infinite alternate;
}
@keyframes rayPulse{
  0%{ opacity:0.6; transform:translateX(-50%) scale(0.95); }
  100%{ opacity:1; transform:translateX(-50%) scale(1.08); }
}

/* Main Container Frame */
.winner-stage{
  position:relative;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:50px;
  width:90%;
  max-width:1200px;
  animation:slamIn 0.8s cubic-bezier(0.19, 1, 0.22, 1) forwards;
}

@keyframes slamIn{
  0%{ transform:scale(1.4); opacity:0; filter:blur(15px); }
  100%{ transform:scale(1); opacity:1; filter:blur(0); }
}

/* LEFT SIDE: Typography and Team Info */
.winner-info-col{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  text-align:left;
}

/* Sub-title badge */
.badge-championship{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:linear-gradient(90deg, #d49a24, #f4cc6a);
  color:#100d02;
  font-family:'Rajdhani', sans-serif;
  font-weight:900;
  font-size:14px;
  letter-spacing:3px;
  padding:4px 16px;
  border-radius:2px;
  text-transform:uppercase;
  box-shadow:0 0 20px rgba(244, 204, 106, 0.4);
  margin-bottom:12px;
}

/* 3D Metallic Golden "WINNERS REVEAL / CHICKEN DINNER" Text */
.winner-headline{
  font-family:'Teko', sans-serif;
  font-size:90px;
  font-weight:700;
  line-height:0.88;
  letter-spacing:2px;
  text-transform:uppercase;
  margin:0;
  background:linear-gradient(180deg, #fff3c4 0%, #ffd05b 28%, #e59c1c 52%, #754403 78%, #f8b939 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 6px 1px #2a1501) drop-shadow(0 15px 30px rgba(255, 178, 36, 0.5));
}

/* Team Card Details */
.winner-team-card{
  display:flex;
  align-items:center;
  gap:20px;
  margin-top:20px;
  background:rgba(18, 24, 34, 0.85);
  border:1px solid rgba(255, 196, 60, 0.35);
  border-left:5px solid #ffb02e;
  border-radius:6px;
  padding:14px 24px;
  box-shadow:0 15px 35px rgba(0,0,0,0.6), inset 0 0 20px rgba(255, 176, 46, 0.08);
  width:100%;
  max-width:560px;
}

.winner-logo-box{
  width:72px;
  height:72px;
  border-radius:6px;
  background:radial-gradient(circle, #253346, #0e141d);
  border:2px solid #ffd23f;
  box-shadow:0 0 20px rgba(255, 210, 63, 0.4);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  flex-shrink:0;
}
.winner-logo-box img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.winner-logo-placeholder{
  font-family:'Teko', sans-serif;
  font-size:36px;
  color:#ffd23f;
  font-weight:700;
}

.winner-name-wrap{
  flex:1;
  min-width:0;
}
.winner-sub-lbl{
  font-size:11px;
  color:#94a3b8;
  letter-spacing:2px;
  text-transform:uppercase;
  font-weight:700;
}
.winner-team-title{
  font-family:'Rajdhani', sans-serif;
  font-size:42px;
  font-weight:900;
  color:#ffffff;
  letter-spacing:1px;
  text-transform:uppercase;
  line-height:1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-shadow:0 2px 10px rgba(0,0,0,0.8);
}

/* Stats Badges */
.winner-stats-row{
  display:flex;
  gap:16px;
  margin-top:18px;
}
.winner-stat-pill{
  background:linear-gradient(135deg, rgba(25, 34, 48, 0.9), rgba(11, 16, 24, 0.95));
  border:1px solid rgba(255, 255, 255, 0.12);
  border-radius:4px;
  padding:8px 20px;
  text-align:center;
  min-width:90px;
}
.winner-stat-pill.pts{
  border-color:rgba(255, 176, 46, 0.5);
  background:linear-gradient(135deg, rgba(46, 32, 10, 0.8), rgba(16, 12, 5, 0.95));
}
.winner-stat-pill b{
  font-family:'Teko', sans-serif;
  font-size:38px;
  line-height:0.9;
  display:block;
  color:#17c9d1;
}
.winner-stat-pill.pts b{ color:#ffd23f; }
.winner-stat-pill span{
  font-family:'Rajdhani', sans-serif;
  font-size:11px;
  color:#8fa3ad;
  letter-spacing:1.5px;
  font-weight:700;
  text-transform:uppercase;
}

/* RIGHT SIDE: The 3D Golden Pan Trophy */
.trophy-container{
  position:relative;
  width:360px;
  height:440px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  animation:trophyFloat 4s ease-in-out infinite alternate;
}
@keyframes trophyFloat{
  0%{ transform:translateY(0); }
  100%{ transform:translateY(-14px); }
}

.trophy-aura{
  position:absolute;
  width:320px;
  height:320px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255, 180, 40, 0.35) 0%, rgba(255, 120, 0, 0.15) 50%, transparent 75%);
  filter:blur(25px);
  z-index:1;
}

/* SVG 3D Golden Pan Trophy Graphics */
.pan-svg{
  width:100%;
  height:100%;
  z-index:3;
  filter:drop-shadow(0 20px 30px rgba(0,0,0,0.85)) drop-shadow(0 0 25px rgba(255,180,40,0.45));
}

/* Pedestal Base */
.trophy-pedestal{
  position:absolute;
  bottom:10px;
  width:260px;
  height:48px;
  background:linear-gradient(180deg, #3d2a0c, #1f1505 80%);
  border:2px solid #996e1b;
  border-radius:4px;
  box-shadow:0 10px 30px rgba(0,0,0,0.9), inset 0 2px 8px rgba(255,200,80,0.4);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:2;
}
.trophy-pedestal::after{
  content:'CHAMPIONS';
  font-family:'Rajdhani', sans-serif;
  font-weight:900;
  font-size:13px;
  letter-spacing:4px;
  color:#fbe49c;
  text-shadow:0 0 8px rgba(251,228,156,0.6);
}
</style>
</head>
<body>

<!-- 1. Left Vertical Ranking Sidebar -->
<div id="stage">
  <div class="head">
    <div>#</div><div>TEAMS</div><div>STATUS</div><div>FIN</div><div>PTS</div>
  </div>
  <div id="rows">
    <div class="empty" id="emptyMsg" style="display:none;">Waiting for data&hellip;</div>
  </div>
  <div class="foot">
    <span class="legend-item"><i class="legend-chip" style="background:#33c766"></i>ALIVE</span>
    <span class="legend-item"><i class="legend-chip" style="background:#f2994a"></i>KNOCKED</span>
    <span class="legend-item"><i class="legend-chip" style="background:#4a4a4a"></i>ELIMINATED</span>
  </div>
</div>

<!-- 2. Top Horizontal Final 4 HUD -->
<div id="final4-bar" class="hidden"></div>

<!-- 3. High-End Esports bgmi Winner Reveal Screen -->
<div id="winner-overlay" class="hidden">
  <canvas id="embersCanvas"></canvas>
  <div class="spotlight-ray"></div>

  <div class="winner-stage">
    <!-- Left Column: Big Bevel Text & Team Card -->
    <div class="winner-info-col">
      <div class="badge-championship">★ BGMI BATTLEGROUNDS ★</div>
      <h1 class="winner-headline">WINNER WINNER<br>CHICKEN DINNER</h1>
      
      <div class="winner-team-card">
        <div class="winner-logo-box" id="winnerLogoContainer">
          <span class="winner-logo-placeholder">#1</span>
        </div>
        <div class="winner-name-wrap">
          <div class="winner-sub-lbl">MATCH CHAMPION</div>
          <div class="winner-team-title" id="winnerTeamName">TEAM NAME</div>

      <div class="winner-stats-row">
        <div class="winner-stat-pill">
          <b id="winnerKills">0</b>

          <b id="winnerPts">0</b>

      </div>
    </div>

    <!-- Right Column: 3D Golden Pan Trophy -->
    <div class="trophy-container">
      <div class="trophy-aura"></div>
      
      <!-- Detailed Golden Frying Pan with Level 3 Helmet Laurels Artwork -->
      <svg class="pan-svg" viewBox="0 0 320 400" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="goldPlate" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fff0b3"/>
            <stop offset="25%" stop-color="#f5c249"/>
            <stop offset="50%" stop-color="#bd8214"/>
            <stop offset="75%" stop-color="#694002"/>

          </linearGradient>
          <linearGradient id="panBevel" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffe699"/>
            <stop offset="50%" stop-color="#805307"/>
            <stop offset="100%" stop-color="#3d2402"/>
          </linearGradient>
        </defs>

        <!-- Pan Handle (Pointing Downward onto Pedestal) -->
        <rect x="148" y="240" width="24" height="95" rx="6" fill="url(#goldPlate)" stroke="#4a2e03" stroke-width="2"/>
        <circle cx="160" cy="315" r="5" fill="#241501"/>

        <!-- Pan Outer Rim -->
        <circle cx="160" cy="140" r="115" fill="url(#panBevel)" stroke="#ffd769" stroke-width="3"/>
        <!-- Pan Inner Circle Surface -->
        <circle cx="160" cy="140" r="98" fill="url(#goldPlate)" stroke="#613c01" stroke-width="2"/>
        <!-- Dark Inner Inset for Depth -->
        <circle cx="160" cy="140" r="82" fill="#291a03" stroke="#b88318" stroke-width="1.5"/>

        <!-- Pan Laurels Wreath (Victory Leaves) -->
        <path d="M 115 170 C 105 130 115 100 135 85" stroke="#fce38a" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M 205 170 C 215 130 205 100 185 85" stroke="#fce38a" stroke-width="4" stroke-linecap="round" fill="none"/>
        
        <!-- bgmi Level 3 Helmet Emblem in Center of Pan -->
        <path d="M 136 142 C 136 116 146 104 160 104 C 174 104 184 116 184 142 L 184 154 L 136 154 Z" fill="url(#goldPlate)"/>
        <!-- Helmet Visor Visor Slit -->
        <rect x="142" y="132" width="36" height="7" rx="2" fill="#170e01"/>
        <line x1="148" y1="135" x2="172" y2="135" stroke="#ffe28a" stroke-width="1.5"/>
        <!-- Helmet Face Shield Plate -->
        <path d="M 142 142 L 178 142 L 174 158 L 146 158 Z" fill="#7a4e08" stroke="#f7cf68" stroke-width="1"/>

      <div class="trophy-pedestal"></div>

  </div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const ROW_H = 34;
const STATUS_COLOR = { eliminated: '#4a4a4a', knocked: '#f2994a', alive: '#33c766' };
const stageEl = document.getElementById('stage');
const rowsEl = document.getElementById('rows');
const emptyMsg = document.getElementById('emptyMsg');
const final4BarEl = document.getElementById('final4-bar');
const winnerOverlayEl = document.getElementById('winner-overlay');

let autoFinal4Enabled = true;

/* Rank-based row styling for Sidebar */
function rowStyle(i) {
  if (i === 0) return { bg: 'linear-gradient(90deg,#3a2f06,#5c4a0a 40%,#2a2204)', accentBg: '#ffd23f', ptsColor: '#ffd23f', txt: '#fff7d6', badgeTxt: '#241c02' };
  if (i === 1) return { bg: 'linear-gradient(90deg,#2b2f33,#454b50 40%,#202325)', accentBg: '#d7dee3', ptsColor: '#d7dee3', txt: '#f2f5f7', badgeTxt: '#1b1e20' };
  if (i === 2) return { bg: 'linear-gradient(90deg,#3a2412,#6b4520 40%,#2a1a0d)', accentBg: '#cd7f32', ptsColor: '#e3995a', txt: '#ffe4c9', badgeTxt: '#291609' };
  return i % 2 === 0
    ? { bg: '#141c24', accentBg: '#17c9d1', ptsColor: '#ffb02e', txt: '#eef2f6', badgeTxt: '#04191b' }
    : { bg: '#1a232c', accentBg: '#17c9d1', ptsColor: '#ffb02e', txt: '#eef2f6', badgeTxt: '#04191b' };
}

function statusBarsHtml(alive, knocked) {
  const total = 4;
  const eliminated = Math.max(0, total - alive - knocked);
  const bars = [];
  for (let i = 0; i < alive; i++) bars.push(STATUS_COLOR.alive);
  for (let i = 0; i < knocked; i++) bars.push(STATUS_COLOR.knocked);
  for (let i = 0; i < eliminated; i++) bars.push(STATUS_COLOR.eliminated);
  return bars.slice(0, total).map(c => `<span class="status-bar" style="background:${c}"></span>`).join('');
}

function fillRow(el, t, i) {
  const s = rowStyle(i);
  el.style.background = s.bg;
  el.style.color = s.txt;
  el.classList.toggle('eliminated', t.alive <= 0);
  const logoHtml = t.logo
    ? `<img class="team-logo" src="${t.logo}" alt="">`
    : `<span class="team-logo"></span>`;
  el.innerHTML = `
    <span class="rank-badge" style="background:${s.accentBg};color:${s.badgeTxt}">${i + 1}</span>
    <span class="team-cell">${logoHtml}<span class="team-name">${escapeHtml(t.name)}</span></span>
    <span class="status-cell">${statusBarsHtml(t.alive, t.knocked || 0)}</span>
    <span class="fin-cell">${t.kills}</span>
    <span class="pts-cell" style="color:${s.ptsColor}">${t.total}</span>
  `;
}

function renderSidebar(teams) {
  emptyMsg.style.display = 'none';
  rowsEl.style.height = (teams.length * ROW_H) + 'px';

  const seenKeys = new Set();
  teams.forEach((t, i) => {
    seenKeys.add(t.key);
    let el = rowsEl.querySelector(`[data-key="${t.key}"]`);
    if (!el) {
      el = document.createElement('div');
      el.className = 'row';
      el.dataset.key = t.key;
      rowsEl.appendChild(el);
    }
    el.style.top = (i * ROW_H) + 'px';
    fillRow(el, t, i);
  });

  rowsEl.querySelectorAll('.row').forEach(el => {
    if (!seenKeys.has(el.dataset.key)) el.remove();
  });
}

function renderFinal4HUD(aliveTeams) {
  const sorted = [...aliveTeams].sort((a, b) => b.kills - a.kills || b.total - a.total);

  final4BarEl.innerHTML = sorted.map(t => {
    const isDead = t.alive <= 0;
    const totalBars = 4;
    const elim = Math.max(0, totalBars - t.alive - (t.knocked || 0));
    let barsHtml = '';
    for (let i = 0; i < t.alive; i++) barsHtml += `<span class="f4-status-bar" style="background:${STATUS_COLOR.alive}"></span>`;
    for (let i = 0; i < (t.knocked || 0); i++) barsHtml += `<span class="f4-status-bar" style="background:${STATUS_COLOR.knocked}"></span>`;
    for (let i = 0; i < elim; i++) barsHtml += `<span class="f4-status-bar" style="background:${STATUS_COLOR.eliminated}"></span>`;

    return `
      <div class="f4-card ${isDead ? 'eliminated' : ''}">
        ${t.logo ? `<img class="f4-logo" src="${t.logo}" alt="">` : `<div class="f4-logo"></div>`}
        <div class="f4-details">
          <span class="f4-name">${escapeHtml(t.name)}</span>
          <div class="f4-status">${barsHtml}</div>
        </div>
        <div class="f4-kills">
          <span class="f4-kills-val">${t.kills}</span>
          <span class="f4-kills-lbl">KILLS</span>
        </div>
      </div>
    `;
  }).join('');
}

/* Trigger Realistic Esports Winner Screen */
function triggerWinnerScreen(winnerTeam) {
  document.getElementById('winnerTeamName').textContent = winnerTeam.name;
  document.getElementById('winnerKills').textContent = winnerTeam.kills;
  document.getElementById('winnerPts').textContent = winnerTeam.total;
  
  const logoBox = document.getElementById('winnerLogoContainer');
  if (winnerTeam.logo) {
    logoBox.innerHTML = `<img src="${winnerTeam.logo}" alt="">`;
  } else {
    logoBox.innerHTML = `<span class="winner-logo-placeholder">#1</span>`;
  }

  winnerOverlayEl.classList.remove('hidden');
  initEmbers();
}

/* Floating Golden Sparks Canvas Particles */
let embersActive = false;
function initEmbers() {
  if (embersActive) return;
  embersActive = true;
  const canvas = document.getElementById('embersCanvas');
  const ctx = canvas.getContext('2d');
  let w = canvas.width = window.innerWidth;
  let h = canvas.height = window.innerHeight;

  window.addEventListener('resize', () => {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  });

  const particles = [];
  for (let i = 0; i < 65; i++) {
    particles.push({
      x: Math.random() * w,
      y: Math.random() * h + h * 0.2,
      r: Math.random() * 2.5 + 0.8,
      vx: (Math.random() - 0.5) * 1.2,
      vy: -(Math.random() * 2 + 1),
      alpha: Math.random() * 0.8 + 0.2,
      hue: Math.random() * 20 + 35 // Golden/orange hues
    });
  }

  function loop() {
    ctx.clearRect(0, 0, w, h);
    for (let p of particles) {
      p.x += p.vx;
      p.y += p.vy;
      p.alpha -= 0.003;
      if (p.y < -10 || p.alpha <= 0) {
        p.x = Math.random() * w;
        p.y = h + 10;
        p.alpha = Math.random() * 0.8 + 0.2;
      }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${p.hue}, 100%, 65%, ${p.alpha})`;
      ctx.shadowBlur = 8;
      ctx.shadowColor = `hsl(${p.hue}, 100%, 50%)`;
      ctx.fill();
    }
    requestAnimationFrame(loop);
  }
  loop();
}

function showEmpty(msg) {
  rowsEl.querySelectorAll('.row').forEach(el => el.remove());
  rowsEl.style.height = 'auto';
  emptyMsg.textContent = msg;
  emptyMsg.style.display = 'block';
}

const { tid, rid, mid, setId } = getUrlIds();

if (!tid || !rid || !mid || !setId) {
  showEmpty('Missing parameters in URL');
} else {
  metaRef(tid, rid, mid, setId).on('value', snap => {
    const meta = snap.val() || {};
    if (meta.autoFinal4 !== undefined) autoFinal4Enabled = Boolean(meta.autoFinal4);
  });

  teamsRef(tid, rid, mid, setId).on('value', snap => {
    const val = snap.val();
    if (!val) { showEmpty('No teams yet'); return; }

    const teams = Object.entries(val).map(([key, t]) => {
      const alive = Number(t.alive ?? 0);
      const kills = Number(t.kills ?? 0);
      const knocked = Number(t.knocked ?? 0);
      const pp = Number(t.placementPoints ?? 0);
      return {
        key,
        name: t.name || 'TEAM',
        logo: t.logo || '',
        alive,
        knocked,
        kills,
        total: pp + kills,
        isAlive: alive > 0
      };
    });

    teams.sort((a, b) => b.total - a.total || b.kills - a.kills);
    const aliveTeams = teams.filter(t => t.isAlive);

    // 1. EXACTLY 1 TEAM ALIVE -> TRIGGER GRAND WINNER SCREEN
    if (aliveTeams.length === 1 && teams.length > 1) {
      stageEl.classList.add('hidden');
      final4BarEl.classList.add('hidden');
      triggerWinnerScreen(aliveTeams[0]);
    }
    // 2. 2 TO 4 TEAMS ALIVE -> SHOW TOP HORIZONTAL HUD
    else if (autoFinal4Enabled && aliveTeams.length <= 4 && aliveTeams.length > 1) {
      winnerOverlayEl.classList.add('hidden');
      stageEl.classList.add('hidden');
      final4BarEl.classList.remove('hidden');
      renderFinal4HUD(aliveTeams);
    } 
    // 3. MORE THAN 4 TEAMS ALIVE -> REGULAR FULL SIDEBAR
    else {
      winnerOverlayEl.classList.add('hidden');
      final4BarEl.classList.add('hidden');
      stageEl.classList.remove('hidden');
      renderSidebar(teams);
    }
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
